<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dot Matrix Flow · 点阵粒子流</title>
  <link rel="stylesheet" href="dot-flow.css" />
  <style>
    :root { --bg: #faf9f7; --fg: #1f1d1a; --muted: #77716a; --line: #e7e3dd; --card: #fff; color-scheme: light; }
    :root[data-theme='dark'] { --bg: #171614; --fg: #ece9e4; --muted: #9a948b; --line: #2d2a26; --card: #1f1e1b; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 24px 64px; background: var(--bg); color: var(--fg); font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
    main { max-width: 760px; margin: 0 auto; display: grid; gap: 28px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
    h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    button, input[type='range'] { font: inherit; }
    .btn { border: 1px solid var(--line); background: var(--card); color: var(--fg); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    /* 1. progress bar */
    .bar { height: 40px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; padding: 0 14px; justify-content: space-between; }
    .pct { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dot-flow); }

    /* 2. ultracode chip */
    .chip { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
    .chip[aria-pressed='true'] { color: var(--dot-flow); border-color: color-mix(in srgb, var(--dot-flow) 45%, var(--line)); }
    .chip dot-flow { display: none; }
    .chip[aria-pressed='true'] dot-flow { display: block; }

    /* 3. table */
    table { width: 100%; border-collapse: collapse; }
    td { padding: 10px 12px; border-top: 1px solid var(--line); }
    tr:first-child td { border-top: 0; }
    .muted { color: var(--muted); }
    .badge { font-size: 12px; color: var(--dot-flow); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Dot Matrix Flow · 点阵粒子流</h1>
      <button class="btn" id="theme">切换亮/暗</button>
    </header>

    <section>
      <h2>Progress · 确定进度</h2>
      <div class="card">
        <div class="bar dot-flow-host" id="bar">
          <dot-flow id="barFlow" state="progress" progress="0.35"></dot-flow>
          <span>下载中 · track-07.flac</span><span class="pct" id="pct">35%</span>
        </div>
        <div class="row" style="margin-top:12px">
          <input type="range" id="slider" min="0" max="100" value="35" style="flex:1" />
          <button class="btn" id="auto">自动跑一遍</button>
        </div>
      </div>
    </section>

    <section>
      <h2>Sweep · 未知进度 / Pulse · 收尾或高强度思考</h2>
      <div class="card row">
        <div class="bar dot-flow-host" style="flex:1;min-width:240px"><dot-flow state="sweep"></dot-flow><span>正在获取地址…</span></div>
        <div class="bar dot-flow-host" style="flex:1;min-width:240px"><dot-flow state="pulse"></dot-flow><span>处理中</span></div>
      </div>
    </section>

    <section>
      <h2>Toggle chip · ultracode 开关</h2>
      <div class="card row">
        <button class="chip" aria-pressed="true" id="chip"><dot-flow state="pulse" pitch="3" alpha="0.55"></dot-flow>✦ Ultracode</button>
        <span class="muted">点击切换；开启时整个胶囊化为紫色点阵</span>
      </div>
    </section>

    <section>
      <h2>Table row · 整行作为进度</h2>
      <div class="card" style="padding:4px 6px">
        <table class="dot-flow-table">
          <tr><td>01</td><td>Song A</td><td class="muted">3:41</td><td class="muted">已完成</td></tr>
          <tr class="is-flowing"><td>02<dot-flow host="tr" id="rowFlow" state="progress" progress="0.62"></dot-flow></td><td>Song B</td><td class="muted">4:05</td><td class="badge">下载中 62%</td></tr>
          <tr class="is-flowing"><td>03<dot-flow host="tr" state="sweep"></dot-flow></td><td>Song C</td><td class="muted">2:58</td><td class="badge">下载中 1.4 MB</td></tr>
          <tr><td>04</td><td>Song D</td><td class="muted">3:12</td><td class="muted">排队中</td></tr>
        </table>
      </div>
    </section>

    <section>
      <h2>Idle · 空闲底纹</h2>
      <div class="card dot-flow-host" style="height:72px"><dot-flow state="idle"></dot-flow></div>
    </section>
  </main>

  <script src="dot-flow.js"></script>
  <script>
    const root = document.documentElement;
    root.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.getElementById('theme').onclick = () => {
      root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    };

    const barFlow = document.getElementById('barFlow');
    const pct = document.getElementById('pct');
    const slider = document.getElementById('slider');
    const setP = (v) => { barFlow.progress = v; pct.textContent = Math.round(v * 100) + '%'; slider.value = Math.round(v * 100); };
    slider.oninput = () => setP(slider.value / 100);

    let timer = 0;
    document.getElementById('auto').onclick = () => {
      clearInterval(timer);
      let v = 0;
      setP(0);
      timer = setInterval(() => {
        v += 0.04 + Math.random() * 0.05;
        if (v >= 1) { clearInterval(timer); barFlow.state = 'pulse'; pct.textContent = '处理中'; setTimeout(() => { setP(1); barFlow.state = 'progress'; }, 1500); return; }
        setP(v);
      }, 350);
    };

    const chip = document.getElementById('chip');
    chip.onclick = () => chip.setAttribute('aria-pressed', chip.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  </script>
</body>
</html>
